<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>PSR-175 Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: full-height practice screen — LCD (song info + staff) on top, falling-note lane, big keyboard, transport bar at the bottom */
:root{
  --bg:#e6e9ed; --surface:#f7f8fa; --ink:#1b2027; --muted:#5b6470; --line:#c4c9d0;
  --btn:#2b3139; --btn-ink:#eef1f4; --accent:#1f5fbf; --accent-ink:#fff;
  --rh:#2f6fe0; --lh:#e0742f; --wrong:#c9302c;
  --lcd:#b6c39a; --lcd-ink:#1d2815; --lcd-dim:#8f9f77;
  --lane:#dde1e6; --lane-line:#c9ced5;
  --hand:rgba(236,224,212,.88); --hand-line:#6b5d52;
  --f-ui:"Archivo",system-ui,sans-serif; --f-lcd:"Share Tech Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171b; --surface:#1d2126; --ink:#e8ebef; --muted:#9aa3ae; --line:#343a42;
  --btn:#39404a; --btn-ink:#eef1f4; --accent:#6aa2ff; --accent-ink:#0c1320;
  --rh:#5b93ff; --lh:#ff9a57; --wrong:#ff6a63;
  --lcd:#a7b88a; --lcd-ink:#17200f; --lcd-dim:#879770; --lane:#191c21; --lane-line:#262b32; --hand:rgba(92,98,108,.9); --hand-line:#c9ced6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b; --surface:#1d2126; --ink:#e8ebef; --muted:#9aa3ae; --line:#343a42;
  --btn:#39404a; --btn-ink:#eef1f4; --accent:#6aa2ff; --accent-ink:#0c1320;
  --rh:#5b93ff; --lh:#ff9a57; --wrong:#ff6a63;
  --lcd:#a7b88a; --lcd-ink:#17200f; --lcd-dim:#879770; --lane:#191c21; --lane-line:#262b32; --hand:rgba(92,98,108,.9); --hand-line:#c9ced6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-ui);-webkit-tap-highlight-color:transparent;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px}
.app{height:100%;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:0}
button,select,input{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top: song picker */
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-stretch:78%;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--muted);font-weight:500}
.songsel{flex:1;min-width:200px;font:600 16px var(--f-ui);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:46px}

/* LCD */
.lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:10px;padding:8px 12px 6px;font-family:var(--f-lcd);box-shadow:inset 0 2px 6px rgba(0,0,0,.25);display:grid;gap:2px}
.lcd .l1{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:baseline;font-size:clamp(15px,2.4vw,20px)}
.lcd .l1 .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd .tag{font-size:12px;letter-spacing:.06em}
.lcd .tag b{font-weight:400;background:var(--lcd-ink);color:var(--lcd);padding:0 5px;border-radius:3px}
.staff{width:100%;height:auto;display:block;max-height:120px}
.staff .ln{stroke:var(--lcd-ink);stroke-width:1;opacity:.75}
.staff .nh{fill:var(--lcd-ink)} .staff .nh.open{fill:none;stroke:var(--lcd-ink);stroke-width:1.6}
.staff .past{opacity:.35} .staff .now .nh{fill:var(--lcd-ink)} .staff .now{filter:none}
.staff .st{stroke:var(--lcd-ink);stroke-width:1.3}
.staff text{fill:var(--lcd-ink);font-family:var(--f-lcd)}
.staff .cur{stroke:var(--lcd-ink);stroke-width:2;opacity:.55}
.staff .hl{fill:var(--lcd-ink);opacity:.14}

/* lane + keyboard */
.lip{flex:none;height:clamp(44px,13vh,110px);background:linear-gradient(#2a2e34,#17191c 30%,#202328);border-top:2px solid #0c0d0f}
.stage:not(.fingers-on) .lip{display:none}
.hands{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.key .lbl{display:grid;justify-items:center;gap:3px}
.key .fn{display:block;width:20px;height:20px;border-radius:50%;background:#fff;color:#1b2027;font:800 12px/20px var(--f-ui);text-align:center}
.key.next .fn{background:var(--rh);color:#fff}
.key.want .fn{color:var(--rh);width:24px;height:24px;line-height:24px;font-size:15px}
.stage{position:relative;flex:1;min-height:150px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--lane)}
.lane{flex:1;min-height:60px;position:relative}
.lane canvas{position:absolute;inset:0;width:100%;height:100%}
.kscroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;background:#111;flex:none}
.kbd{position:relative;height:clamp(120px,24vh,210px);user-select:none;-webkit-user-select:none;touch-action:pan-x}
.key{position:absolute;top:0;border:1px solid #555a62;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:700 11px var(--f-ui);color:#7a8089;cursor:pointer}
.key.w{background:#fbfbfa;height:100%;z-index:1}
.key.b{background:#1a1d21;height:62%;z-index:2;border-color:#000;color:#9aa}
.key .lbl{pointer-events:none}
.key.next{box-shadow:inset 0 -4px 0 var(--rh)}
.key .rise{position:absolute;left:2px;right:2px;bottom:2px;height:0;border-radius:4px;opacity:.55;pointer-events:none;z-index:0}
.key.b .rise{left:2px;right:2px;opacity:.7}
.key .lbl{position:relative;z-index:1}
.key.r{background:var(--rh)!important;color:#fff}
.key.l{background:var(--lh)!important;color:#fff}
.key.down.w{background:#d9dde3} .key.down.b{background:#444a52}
.key.bad{background:var(--wrong)!important}
.key.good{background:#2e9d5b!important;color:#fff}
.key.next.w{background:color-mix(in srgb,var(--rh) 8%,#fbfbfa)} .key.next.b{background:color-mix(in srgb,var(--rh) 20%,#1a1d21)}
.key.next.nl.w{background:color-mix(in srgb,var(--lh) 9%,#fbfbfa)} .key.next.nl.b{background:color-mix(in srgb,var(--lh) 20%,#1a1d21)}
.key.next.nl .fn{background:var(--lh)}
.key.next.nl{box-shadow:inset 0 -6px 0 var(--lh)}
.key.want.wl{background:var(--lh)!important;animation:wantl 1s ease-in-out infinite}
.key.want.wl .fn{color:var(--lh)}
@keyframes wantl{0%,100%{filter:brightness(1);box-shadow:inset 0 0 0 3px #fff8,0 0 0 0 var(--lh)}50%{filter:brightness(1.2);box-shadow:inset 0 0 0 3px #fff,0 0 14px 4px var(--lh)}}
.key.want{background:var(--rh)!important;color:#fff;animation:want 1s ease-in-out infinite}
.key.want .lbl{font-size:15px}
@keyframes want{0%,100%{filter:brightness(1);box-shadow:inset 0 0 0 3px #fff8,0 0 0 0 var(--rh)}50%{filter:brightness(1.25);box-shadow:inset 0 0 0 3px #fff,0 0 14px 4px var(--rh)}}
.key.c .oct{position:absolute;top:6px;font-size:9px;color:#a0a6ae}

/* transport */
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.grp{display:flex;gap:6px;align-items:center}
.tb{min-width:48px;min-height:48px;border-radius:12px;border:0;background:var(--btn);color:var(--btn-ink);font:700 18px var(--f-ui);cursor:pointer;display:grid;place-items:center;padding:0 12px;touch-action:manipulation}
.tb svg{width:22px;height:22px;fill:currentColor}
.tb.lb{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;line-height:1}
.tb.lb svg{width:19px;height:19px}
.tl{font:700 9.5px var(--f-ui);letter-spacing:.02em;white-space:nowrap;opacity:.9}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);font:700 14px var(--f-ui);padding:6px 14px;border-radius:20px;z-index:6;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:.95}
.sndoff{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:7;background:var(--accent);color:var(--accent-ink);border:0;border-radius:22px;padding:10px 16px;font:700 14px var(--f-ui);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
.tb.play{background:var(--accent);color:var(--accent-ink);min-width:72px}
.tb.on{background:var(--accent);color:var(--accent-ink)}
.tb.sm{min-width:44px;font-size:20px}
.speed{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 260px}
.speed input{flex:1;min-width:80px;height:36px;accent-color:var(--accent)}
.speed output{font:16px var(--f-lcd);min-width:5.5ch;text-align:right;font-variant-numeric:tabular-nums}
.speed .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--f-ui);padding:0 12px;min-height:46px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.spd{display:grid;gap:6px;flex:1 1 300px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.spd-head{display:flex;align-items:baseline;gap:10px}
.spd-head .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;flex:1}
.spd-head output{font:700 20px var(--f-lcd);min-width:0;color:var(--ink)}
.spd-head .bpm{font:13px var(--f-lcd);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.spd-head output{white-space:nowrap}
.spd .speed{flex:none}
.presets{display:flex}
.presets button{flex:1;min-height:38px;font-variant-numeric:tabular-nums}
.prog{display:flex;align-items:center;gap:8px;flex:1 1 100%}
.prog input{flex:1;accent-color:var(--accent);height:28px}
.prog span{font:13px var(--f-lcd);color:var(--muted);white-space:nowrap}
.hint{font-size:13px;color:var(--muted);min-height:1.3em}
.hint b{color:var(--ink)}
@media (max-width:700px){
  .brand{display:none}
  .seg button{padding:0 9px;font-size:12px}
  .bar{gap:8px}
  .speed{flex-basis:100%}
}
@media (max-height:520px) and (orientation:landscape){
  .staff{max-height:70px}
  .lcd{padding:4px 10px}
  .kbd{height:clamp(100px,30vh,160px)}
}
/* ===== Kindermodus ===== */
#bKid{font-size:22px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
#bKid.on{background:#ffd23f;border-color:#e7b31f}
#kidTitle{display:none;font:800 20px var(--f-ui);flex:1;min-width:0;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
body.kid #kidTitle{display:flex}
body.kid .songsel{display:none}
body.kid .lcd{display:none}
body.kid .rotate{display:none}
.kidbar{display:none}
body.kid .bar>*:not(.kidbar){display:none!important}
body.kid .kidbar{display:grid;gap:10px;width:100%;align-content:start}
.kb{font:800 19px var(--f-ui);border:0;border-radius:16px;min-height:58px;background:var(--surface);border:2px solid var(--line);color:var(--ink);cursor:pointer;touch-action:manipulation}
#kbPlay{background:var(--accent);color:var(--accent-ink);min-height:74px;font-size:24px;border:0}
.kstatus{font:800 17px var(--f-ui);text-align:center;background:var(--lcd);color:var(--lcd-ink);border-radius:12px;padding:10px 8px;min-height:1.4em}
.krow{display:flex;gap:8px}
.krow .kb{flex:1;min-width:0}
.kb.on{background:#2e9d5b;border-color:#2e9d5b;color:#fff}
.kcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kcard{display:grid;justify-items:center;gap:2px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 2px;cursor:pointer;font:700 11px var(--f-ui);color:var(--ink);min-width:0}
.kcard .em{font-size:30px;line-height:1.1}
.kcard .st{font-size:10px;letter-spacing:1px;min-height:1.1em}
.kcard.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
body.kid .key.want{background:var(--kc,var(--rh))!important}
body.kid .key.r,body.kid .key.l{background:var(--kc,var(--rh))!important;color:#fff}
body.kid .kbd{touch-action:none}
body.kid .key .lbl{font-size:15px}
body.kid .key .fn{width:26px;height:26px;line-height:26px;font-size:15px;color:#fff}
.confetti{position:absolute;top:-8%;font-size:28px;z-index:8;pointer-events:none;animation:cfall 2s ease-in forwards}
@keyframes cfall{to{transform:translateY(115vh) rotate(540deg)}}
@media (orientation:landscape) and (min-width:560px){
  body.kid .app{grid-template-areas:"stage top" "stage bar";grid-template-rows:auto minmax(0,1fr)}
}
/* no text-selection magnifier or long-press callout on playing surfaces */
.stage,.stage *,.kidbar,.kidbar *,.tb,.kb,.seg button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body.kid,body.kid *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Collapsible control panel — hidden by default for a full-screen keyboard ===== */
#bPlayMini{display:none}
body.nopanel #bPlayMini{display:grid}
body.nopanel .bar{display:none!important}
#bPanel.on{background:var(--accent);color:var(--accent-ink)}
body.nopanel .kbd{height:clamp(130px,32vh,300px)}

/* ===== Landscape: display + keyboard on the left, controls in a side column ===== */
.rotate{display:none}
.fs{display:none}
@media (orientation:portrait) and (pointer:coarse){
  .rotate{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
  .rotate svg{width:26px;height:26px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .rotate span{flex:1}
  .rotate button{border:0;background:none;color:var(--muted);font:700 20px var(--f-ui);width:36px;height:36px;cursor:pointer}
  .rotate.off{display:none}
}
@media (orientation:landscape) and (min-width:560px){
  body{padding-block:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-bottom,0px))}
  .app{display:grid;grid-template-columns:minmax(0,1fr) clamp(230px,26vw,300px);grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"lcd top" "lcd bar" "stage bar";gap:8px 10px;max-width:none}
  .top{grid-area:top;align-self:start;flex-wrap:nowrap}
  .top .brand{display:none}
  .songsel{min-width:0;width:100%;font-size:14px;min-height:42px;padding:8px 10px}
  .lcd{grid-area:lcd}
  .stage{grid-area:stage;min-height:0}
  .bar{grid-area:bar;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:8px;overflow-y:auto;min-height:0;padding-bottom:0}
  .bar>.grp:first-child{justify-content:space-between}
  .bar>.grp:first-child .tb{flex:1;min-width:0;padding:0}
  .bar>.grp:first-child .tb.play{flex:1.6}
  .speed{flex:none;gap:6px}
  .spd{flex:none;padding:6px 8px;gap:4px}
  .seg{display:flex}
  .seg button{flex:1;padding:0 4px;font-size:12px}
  .row2{display:flex;gap:8px}
  .row2 .seg{flex:1}
  .prog{flex:none}
  .prog span{font-size:12px}
  .hint{font-size:12px}
  .fs{display:grid}
  .kbd{height:clamp(110px,34vh,240px)}
  body.nopanel .app{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"lcd top" "stage stage"}
  body.kid.nopanel .app{grid-template-areas:"top top" "stage stage";grid-template-columns:minmax(0,1fr) auto}
  body.nopanel .songsel{width:auto;max-width:30vw}
  body.nopanel .kbd{height:clamp(120px,46vh,340px)}
}
/* phone held sideways: very little height, keep everything on one screen */
@media (orientation:landscape) and (max-height:520px){
  body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .app{grid-template-columns:minmax(0,1fr) clamp(210px,30vw,260px);gap:6px 8px}
  .lcd{padding:3px 10px;gap:0}
  .lcd .l1{font-size:14px}
  .lcd .l1:last-child{display:none}
  .staff{max-height:46px}
  .kbd{height:clamp(96px,40vh,180px)}
  body.nopanel .kbd{height:clamp(96px,52vh,260px)}
  .lip{height:clamp(26px,9vh,46px)}
  .key{font-size:10px;padding-bottom:4px}
  .tb{min-height:40px;min-width:40px;border-radius:10px}
  .tb svg{width:19px;height:19px}
  .seg button{min-height:38px}
  .songsel{min-height:38px;padding:6px 8px}
  .speed input{height:28px}
  .spd-head output{font-size:16px}
  .presets button{min-height:32px}
  .bar{gap:6px}
  .hint{display:none}
  .prog input{height:22px}
}
</style>

<div class="app">
  <div class="rotate" id="rotate"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2" transform="rotate(-90 12 12)"/><path d="M4 8a8 8 0 0 1 4-4M8 4h-3v3"/></svg><span>Turn your device sideways for the biggest keyboard.</span><button aria-label="Dismiss" id="rotX">×</button></div>
  <div class="top">
    <div class="brand">PSR-175 <span>Coach</span></div>

    <button class="tb sm" id="bPanel" aria-label="Show controls" title="Show/hide controls"><svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></button>
  </div>

  <div class="lcd" aria-live="polite">
    <div class="l1"><span class="name" id="lName">006 Für Elise</span><span id="lMeas">M 001</span><span id="lTempo">♩=66</span></div>
    <svg class="staff" id="staff" viewBox="0 0 640 110" preserveAspectRatio="none" aria-label="Notation"></svg>
    <div class="l1" style="font-size:13px"><span class="tag" id="lMode"><b>WATCH</b></span><span class="tag" id="lHand">RIGHT HAND</span><span class="tag" id="lChord"></span><span class="tag" id="lGrade" style="margin-left:auto"></span></div>
  </div>

  <div class="stage">
    <canvas id="hands" class="hands" aria-hidden="true"></canvas>
    <div class="toast" id="toast" role="status"></div>

  </div>

  <div class="bar">
    <div class="kidbar" id="kidbar">
      <div class="kstatus" id="kStatus">👉 Press the glowing key!</div>
      <button class="kb" id="kbPlay">▶ Play</button>
      <div class="krow"><button class="kb" id="kListen">👂 Listen</button><button class="kb" id="kPlay2">✋ Play it</button></div>
      <div class="krow" id="kSpeed"><button class="kb" data-s="50">🐢</button><button class="kb" data-s="70">🚶</button><button class="kb" data-s="100">🐰</button></div>
      <button class="kb" id="kMic">🎤 Mic off — playing on screen</button>
      <div class="kcards" id="kcards"></div>

const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};

  setHint(fingersOn?'Fingering on: numbers show which finger to use. 1 = thumb, 2 = index, 3 = middle, 4 = ring, 5 = little finger.':'Fingering hands hidden.');});
window.addEventListener('keydown',e=>{if(e.target.matches('select,input'))return; if(e.code==='Space'){e.preventDefault(); togglePlay()} if(e.key==='ArrowRight')$('bNext').click(); if(e.key==='ArrowLeft')$('bPrev').click();});

/* ======== CLOCK ======== */
let lastTs=performance.now();
function tick(now){
  const dtP=Math.min(.25,(now-lastTs)/1000); lastTs=now;
  if(resyncPending){resyncPending=false; resync();}
  if(playing&&!waiting){
    const bps=song.bpm*speed/100/60;
    let dt=dtP; if(actx&&actx.state==='running'){const ac=actx.currentTime; if(clockA!=null)dt=Math.min(.25,Math.max(0,ac-clockA)); clockA=ac;}
    let nt=t+dt*bps;
    let rq=null;
    if(mode==='wait'){rq=required(); if(rq.notes.length&&rq.ts>okT+1e-6&&nt>=rq.ts){nt=rq.ts; waiting=true; clockA=null; markKeys();
      setHint('Waiting… press the glowing key'+(rq.notes.length>1?'s':'')+': '+rq.notes.map(e=>'<b>'+nm(e.m)+'</b>').join(' + ')+(rq.notes.length===1?fingerTxt(rq.notes[0]):' (all together)'));}}
    // schedule sound up to 0.12 s ahead, on the audio clock (smooth even if the screen stutters)
    let horizon=nt+.12*bps; if(rq&&rq.notes.length&&rq.ts>okT+1e-6)horizon=Math.min(horizon,rq.ts-1e-3);
    if(loop==='bar')horizon=Math.min(horizon,barStart(song,loopBar+1)-1e-3);
    for(let b=Math.max(beatSched+1,Math.ceil(t-1e-6));b<=horizon+1e-6;b++){beatSched=b;
      if(b<0||metro){const off=b-song.pickup; const r=((off%song.ts)+song.ts)%song.ts; click(r<1e-6||Math.abs(r-song.ts)<1e-6,(b-nt)/bps);}}
    PARTS.forEach(h=>{const ev=data[h]; while(aptr[h]<ev.length&&ev[aptr[h]].s<=horizon+1e-6){const e=ev[aptr[h]];
      if(e.s>=t-1e-3&&(!shown(h)||mode!=='wait')&&!(micOn&&mode!=='watch'))tone(e.m,e.d/bps,(mode==='along'&&shown(h))?.07:(h==='L'?(shown('L')?.24:.16):(shown('R')?.32:.2)),(e.s-nt)/bps); aptr[h]++;}});
    // visual pointer follows the musical time — but in Wait mode it must stop ON the awaited notes
    const vcap=(mode==='wait'&&rq&&rq.notes.length&&rq.ts>okT+1e-6)?Math.min(nt,rq.ts-1e-3):nt;
    PARTS.forEach(h=>{const ev=data[h]; while(ptr[h]<ev.length&&ev[ptr[h]].s<=vcap+1e-6)ptr[h]++;});
    t=nt;
    PARTS.forEach(h=>{active[h]=data[h].slice(0,ptr[h]).filter(x=>x.s+x.d>t);});
    if(mode==='along')PARTS.forEach(h=>{if(!shown(h))return; data[h].slice(0,ptr[h]).forEach(e=>{if(!e._judged&&!e._hit&&t>e.s+Math.max(.4,e.d*.8)){e._judged=true; misses++; grade();}});});
    const sig=PARTS.map(h=>active[h].map(e=>e.m+'@'+e.s).join(',')+'|'+ptr[h]).join('/'); if(sig!==actSig){actSig=sig; markKeys();}
    if(loop==='bar'&&t>=barStart(song,loopBar+1)-1e-6&&t<barStart(song,loopBar+1)+song.ts){seekTo(barStart(song,loopBar)); playing=true; setPlayIcon();}
    else if(t>=data.total){ if(loop!=='off'){seekTo(loop==='bar'?barStart(song,loopBar):0); playing=true; setPlayIcon();} else {stop(); active={R:[],L:[]}; markKeys(); if(kid&&mode!=='watch')celebrate(); setHint(mode==='watch'?'Finished. Try <b>Play along</b> or <b>Wait for me</b> next.':'Finished! '+($('lGrade').textContent||''));}}
  }
  frame();
requestAnimationFrame(tick);}
let riseKeys=[];
const busy=k=>k.classList.contains('r')||k.classList.contains('l')||k.classList.contains('want');
function updateApproach(){
  const la=1.6; const act=[];
  if(data&&!(mode==='wait'&&(waiting||!playing))){
    PARTS.forEach(h=>{ if(!shown(h))return;
      group(h).forEach(e=>{const k=keys[e.m]; if(!k)return; const d=e.s-t; if(d<0||d>la)return;
        const p=playing?1-d/la:.3;
        k._rise.style.height=(p*100).toFixed(1)+'%';
        k._rise.style.background=kid&&e.f?FCOL[e.f]:(h==='L'?'var(--lh)':'var(--rh)');
        if(!busy(k)){k.classList.add('next'); k.classList.toggle('nl',h==='L'); lbl(k,e);}
        act.push(k);});});}
  riseKeys.forEach(k=>{if(!act.includes(k)){k._rise.style.height='0%'; k.classList.remove('next','nl'); if(!busy(k))k.firstChild.textContent='';}});
  riseKeys=act;}
function frame(force){drawLane(); updateApproach(); drawHands(); drawStaff(force); lcdText();}

$('sndOff').addEventListener('click',()=>{
  if(actx&&actx.state!=='running'){try{actx.close()}catch(e){} actx=null;}   // rebuild a stuck audio engine
  audio(); unlock(); tone(72,.3,.2); resync(); setTimeout(()=>{$('sndOff').hidden=!!(actx&&actx.state==='running')?true:false;},400); $('sndOff').hidden=true;});
/* ======== MICROPHONE: hear the real PSR-175 ======== */
let micOn=false,micStream=null,micAn=null,micTimer=null,micBuf=null,micBlankUntil=0,micLastFired=-1,micLastMidi=-1,micStable=0;
const freqToMidi=f=>Math.round(69+12*Math.log2(f/440));
function autoCorrelate(buf,sr){let rms=0; for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/buf.length);
  if(rms<0.02)return -1;
  const minL=Math.max(8,Math.floor(sr/1100)), maxL=Math.min(buf.length-2,Math.ceil(sr/55));
  let norm0=0; for(let i=0;i<buf.length;i++)norm0+=buf[i]*buf[i];
  const c=new Float32Array(maxL+3); let best=-1,bestL=-1;
  for(let l=minL-1;l<=maxL+1;l++){let sum=0; for(let i=0;i<buf.length-l;i++)sum+=buf[i]*buf[i+l]; c[l]=sum;}
  for(let l=minL;l<=maxL;l++){if(c[l]>best){best=c[l]; bestL=l;}}
  if(best<0.3*norm0)return -1;
  let bl=bestL; // smallest-lag LOCAL PEAK nearly as strong as the best = the fundamental
  for(let l=minL;l<=maxL;l++){if(c[l]>c[l-1]&&c[l]>=c[l+1]&&c[l]>=0.88*best){bl=l; break;}}
  const x1=c[bl-1]||0,x2=c[bl],x3=c[bl+1]||0,a=(x1+x3-2*x2)/2,b=(x3-x1)/2; let T=bl; if(a)T=bl-b/(2*a);
  if(!(T>minL/2))return -1;
  return sr/T;}
function micNote(midi){ if(!data||mode==='watch')return;
  const rq=required(); if(!rq.notes.length)return;
  const pc=((midi%12)+12)%12;
  const hit=rq.notes.find(e=>!hitSet.has(e)&&(e.m===midi||((e.m%12)===pc&&Math.abs(e.m-midi)<=24)));
  if(hit)pressKey(hit.m,keys[hit.m],true);}
function micLbl(txt){const n=micOn?(txt?'🎤 '+txt:'🎤 …'):'🎤';
  $('micLbl').textContent=micOn?(txt||'listening'):'Mic off'; $('micIco').textContent='🎤';
  const k=$('kMic'); if(k)k.textContent=micOn?('🎤 Hearing your keyboard'+(txt?': '+txt:'')):'🎤 Mic off — playing on screen';}
function micLoop(){ if(!micAn||!actx)return; micAn.getFloatTimeDomainData(micBuf);
  if(performance.now()<micBlankUntil)return;
  const f=autoCorrelate(micBuf,actx.sampleRate);
  if(f<0){micStable=0; micLastMidi=-1; micLastFired=-1; return;}
  const m=freqToMidi(f); if(m<28||m>100)return;
  if(m===micLastMidi)micStable++; else{micLastMidi=m; micStable=1;}
  if(micStable===2&&m!==micLastFired){micLastFired=m; micLbl(noteName(m)); micNote(m);}}
function micProblem(e){
  if(location.protocol==='file:'||location.protocol==='content:')return '<b>Chrome blocks the microphone for pages opened from Downloads or storage (file:// and content:// addresses).</b> The page needs a real https web address. Easiest: go to <b>app.netlify.com/drop</b> on a PC, drag psr175.html onto it, and open the link it gives you on the tablet — or put the file on any webspace you already use. Everything except the mic also works right here.';
  if(!window.isSecureContext)return '<b>This address is not https</b>, so the browser withholds the microphone. Open the page from an https address.';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    return (window.top!==window.self)?'<b>The microphone is blocked in this claude.ai view</b> — a platform restriction, not a setting. Open psr175.html from an https address instead (e.g. via app.netlify.com/drop).':'<b>This browser view offers no microphone access.</b> Try opening the page in Chrome or Safari from an https address.';
  if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))return '<b>Microphone permission was denied.</b> Tap the padlock next to the address, allow the microphone for this page, then switch the mic on again.';
  if(e&&e.name==='NotFoundError')return '<b>No microphone was found</b> on this device.';
  return '<b>The microphone could not be started.</b> '+((e&&e.message)||'');}
async function setMic(v){
  if(v&&(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)){
    micOn=false; toast('🎤 Not possible here'); setHint(micProblem(null));
    $('bMic').classList.toggle('on',false); const kq=$('kMic'); if(kq)kq.classList.toggle('on',false); micLbl(''); return;}
  if(v){ try{
      const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      audio(); micStream=st; const src=actx.createMediaStreamSource(st);
      micAn=actx.createAnalyser(); micAn.fftSize=2048; micBuf=new Float32Array(2048); src.connect(micAn);
      micOn=true; micLastFired=-1; micTimer=setInterval(micLoop,70);
      toast('🎤 I can hear your keyboard!');
      if(hands!=='R')setHint('The microphone hears <b>one note at a time</b> — it works best for the right-hand melody. Chords (Left/Both) are better tapped on screen.');
      else setHint('🎤 Mic on: play on your PSR-175 and the song moves on when it hears the right note. Wrong notes are never counted via mic.');
    }catch(e){ micOn=false; toast('🎤 Blocked here'); setHint(micProblem(e));}}
  else{ micOn=false; clearInterval(micTimer); micTimer=null;
    if(micStream){micStream.getTracks().forEach(t=>t.stop()); micStream=null;} micAn=null;
    toast('Mic off — play on the screen'); }
  $('bMic').classList.toggle('on',micOn); const k=$('kMic'); if(k)k.classList.toggle('on',micOn); micLbl('');}
$('bMic').addEventListener('click',()=>setMic(!micOn));
$('kMic').addEventListener('click',()=>setMic(!micOn));

/* ===== Kindermodus wiring ===== */
const KIDSET=[['036','⭐','Twinkle'],['053','🌉','London Bridge'],['013','😊','Ode to Joy'],['076','🔔','Jingle Bells'],['077','🌙','Silent Night'],['043','🕊️','Amazing Grace']];
const kidStars=n=>store.get('stars.'+n,0);
function kidCards(){const el=$('kcards'); el.innerHTML=KIDSET.map(([n,em,nm])=>{const i=SONGS.findIndex(x=>x.n===n);
  return `<button class="kcard ${song&&song.n===n?'sel':''}" data-i="${i}"><span class="em">${em}</span><span>${nm}</span><span class="st">${'⭐'.repeat(kidStars(n))||'&nbsp;'}</span></button>`}).join('');}
function kidTitleUpd(){const k=KIDSET.find(([n])=>song&&n===song.n); $('kidTitle').textContent=(k?k[1]+' '+k[2]:song.t)+'  '+'⭐'.repeat(kidStars(song.n));}
function reflectKid(){$('kListen').classList.toggle('on',mode==='watch'); $('kPlay2').classList.toggle('on',mode==='wait');
  document.querySelectorAll('#kSpeed .kb').forEach(b=>b.classList.toggle('on',+b.dataset.s===speed));}
function syncSegs(){document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===mode));
  document.querySelectorAll('#handSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===hands));}
function setKid(v){kid=v; store.set('kid',v); document.body.classList.toggle('kid',v); $('bKid').classList.toggle('on',v);
  if(v){ if(!KIDSET.some(([n])=>song.n===n))loadSong(SONGS.findIndex(x=>x.n==='036'));
    mode='wait'; hands='R'; if(speed>100||speed<50)setSpeed(70); stop(); seekTo(0); syncSegs(); kidCards(); kidTitleUpd(); reflectKid();
    toast('Press the glowing key!'); }
  layoutKeyboard(); markKeys(); frame(true);}
$('bKid').addEventListener('click',()=>setKid(!kid));
$('kbPlay').addEventListener('click',()=>{audio();
  if(mode==='wait'){hits=0; misses=0; grade(); stop(); seekTo(0); markKeys(); frame(true); toast('From the top!');}
  else togglePlay(); kidStatus();});
$('kListen').addEventListener('click',()=>{audio(); mode='watch'; store.set('mode',mode); waiting=false; hits=0;misses=0;
  syncSegs(); reflectKid(); stop(); seekTo(0); togglePlay(true); markKeys(); frame(true); toast('Listen closely!'); kidStatus();});
$('kPlay2').addEventListener('click',()=>{mode='wait'; store.set('mode',mode); waiting=false; hits=0;misses=0; stop(); seekTo(0); syncSegs(); reflectKid(); markKeys(); frame(true); toast('Press the glowing key!'); kidStatus();});
document.querySelectorAll('#kSpeed .kb').forEach(b=>b.addEventListener('click',()=>{setSpeed(+b.dataset.s); reflectKid();
  toast({50:'🐢 Slow',70:'🚶 Medium',100:'🐰 Fast'}[speed]||''); kidStatus();}));
$('kcards').addEventListener('click',e=>{const c=e.target.closest('.kcard'); if(!c)return; audio(); loadSong(+c.dataset.i);
  kidCards(); kidTitleUpd(); reflectKid();
  if(mode==='watch'){togglePlay(true); toast('Listen closely!');} else toast('Press the glowing key!'); kidStatus();});
function celebrate(){const tot=hits+misses;
  const st=mode==='wait'?(misses===0?3:misses<=3?2:1):(tot?(hits/tot>=.95?3:hits/tot>=.8?2:1):1);
  if(st>kidStars(song.n))store.set('stars.'+song.n,st);
  toast('Well done! '+'⭐'.repeat(st));
  const stg=document.querySelector('.stage');
  for(let i=0;i<26;i++){const d=document.createElement('span'); d.className='confetti'; d.textContent=['🎉','⭐','✨','🎈','🎵'][i%5];
    d.style.left=(2+Math.random()*94)+'%'; d.style.animationDelay=(Math.random()*.6)+'s'; stg.appendChild(d); setTimeout(()=>d.remove(),2800);}
  playDing(); setTimeout(playDing,250); kidCards(); kidTitleUpd();}

/* landscape helpers */
if(store.get('rotOff',false))$('rotate').classList.add('off');
$('rotX').addEventListener('click',()=>{$('rotate').classList.add('off'); store.set('rotOff',true); setTimeout(()=>{layoutKeyboard();markKeys();frame(true)},50)});
const canFS=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);

$('bFull').addEventListener('click',async()=>{const d=document,el=d.documentElement;
  try{ if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
    else{ const req=el.requestFullscreen||el.webkitRequestFullscreen; if(!req||!canFS)throw new Error('no-fs');
      await req.call(el); try{await screen.orientation.lock('landscape')}catch(e){}} }
  catch(e){ toast('Full screen is blocked here'); setHint('<b>Full screen is blocked inside this window.</b> On a tablet: open this page on its own in the browser (not inside the Claude app), then turn the tablet sideways. iPad Safari: tap <b>aA</b> in the address bar → <b>Hide Toolbar</b>. Android Chrome: use this button again there.'); }});
let rT; const relayout=()=>{clearTimeout(rT); rT=setTimeout(()=>{layoutKeyboard(); markKeys(); frame(true)},120)};
function setPanel(v){document.body.classList.toggle('nopanel',!v); const b=$('bPanel'); b.classList.toggle('on',v);
  b.setAttribute('aria-label',v?'Hide controls':'Show controls'); store.set('panel',v); setPlayIcon(); relayout();}
$('bPanel').addEventListener('click',()=>setPanel(document.body.classList.contains('nopanel')));
window.addEventListener('orientationchange',relayout); document.addEventListener('fullscreenchange',relayout);

/* init */
readColors(); matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{readColors()});
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
$('kscroll').addEventListener('scroll',()=>drawLane(),{passive:true});
// a held key must never open the browser's long-press menu
document.addEventListener('contextmenu',e=>{ if(kid||e.target.closest('.stage,.kidbar,.tb,.kb,.seg,.key'))e.preventDefault(); });
window.addEventListener('resize',()=>relayout());
loadSong(+sel.value); setSpeed(speed); setHint(MODEHINT[mode]+' Press <b>Play</b> to start.');
setPanel(store.get('panel',false));
if(store.get('kid',false))setKid(true);
requestAnimationFrame(tick);
</script>
